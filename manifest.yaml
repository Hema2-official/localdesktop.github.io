icon: assets/icon.png
android:
  assets:
    - assets/setup-progress.html
    - assets/terminal.html
    - assets/phantom-process-killer.html
    - assets/xterm
    - assets/unsupported.html
    - assets/ld-linux-aarch64.so.1
    - assets/wireplumber-share.tar
    - assets/guest
  runtime_libs:
    - assets/libs
  gradle: true
  manifest:
    package: app.polarbear
    sdk:
      min_sdk_version: 21
      target_sdk_version: 33
    application:
      label: "Local Desktop"
      extract_native_libs: true # Required for proot invocations
      # Android's Auto Backup runs in the app's process and kills it afterwards (seen killing an
      # install midway), and the Linux system is far too big to back up anyway.
      allow_backup: false
      use_cleartext_traffic: true # Required for connecting to ws://127.0.0.1, see assets/setup-progress.html
      activities:
        - {} # The NativeActivity; the APK builder fills it in
        - name: app.polarbear.WebPageActivity # The app's own pages, such as the terminal
          label: "Local Desktop"
          exported: false
          launch_mode: singleTop
          window_soft_input_mode: adjustResize
          # Keep the page (and the terminal session in it) when the phone rotates or a keyboard attaches
          config_changes: "orientation|screenSize|smallestScreenSize|screenLayout|keyboard|keyboardHidden|density|uiMode"
        - name: app.polarbear.ShareActivity # Files and links from other apps, for the desktop
          # No label of its own: share sheets show the app's, which differs between builds
          exported: true
          # See-through: it only shows a progress dialog, and only when copying takes a while
          theme: "@android:style/Theme.Translucent.NoTitleBar"
          # One copy per share: rotating the phone mustn't start it again
          config_changes: "orientation|screenSize|smallestScreenSize|screenLayout|keyboard|keyboardHidden|density|uiMode"
          intent_filters:
            - actions:
                - android.intent.action.SEND
                - android.intent.action.SEND_MULTIPLE
              categories:
                - android.intent.category.DEFAULT
              data:
                - mime_type: "*/*"
            # "Open with"
            - actions:
                - android.intent.action.VIEW
              categories:
                - android.intent.category.DEFAULT
              data:
                - scheme: content
                  mime_type: "*/*"
                - scheme: file
                  mime_type: "*/*"
        # Immersive mode on VR headsets (src/android/xr.rs). Meta Horizon OS runs activities with the
        # VR category full-field and the others as panels; the app switches between them. A task of
        # its own, so the desktop's panel can come up over it and leaving doesn't take the panel along.
        - name: app.polarbear.XrActivity
          label: "Local Desktop"
          exported: true
          launch_mode: singleTask
          task_affinity: ".xr"
          orientation: landscape
          config_changes: "density|keyboard|keyboardHidden|navigation|orientation|screenLayout|screenSize|uiMode"
          intent_filters:
            - actions:
                - android.intent.action.MAIN
              categories:
                - android.intent.category.DEFAULT
                - com.oculus.intent.category.VR
          meta_data:
            - name: com.oculus.vr.focusaware
              value: "true"
      services:
        - name: app.polarbear.SessionService
          exported: false
          foreground_service_type: "0x40000000" # specialUse, newer than the android.jar the manifest compiles against
        - name: app.polarbear.KeyboardAccessibilityService
          permission: android.permission.BIND_ACCESSIBILITY_SERVICE
          label: "@string/keyboard_service_label"
          enabled: true
          exported: false
          intent_filters:
            - actions:
                - android.accessibilityservice.AccessibilityService
          meta_data:
            - name: android.accessibilityservice
              resource: "@xml/keyboard_accessibility_service"
      meta_data:
        - name: com.samsung.android.dex.launchwidth
          value: 0
        - name: com.samsung.android.dex.launchheight
          value: 0
        - name: com.samsung.android.sdk.multiwindow.dex.launchwidth
          value: 0
        - name: com.samsung.android.sdk.multiwindow.dex.launchheight
          value: 0
    uses_permission:
      - name: android.permission.INTERNET
      - name: android.permission.ACCESS_NETWORK_STATE
      - name: android.permission.POST_NOTIFICATIONS
      - name: android.permission.FOREGROUND_SERVICE
      - name: android.permission.FOREGROUND_SERVICE_SPECIAL_USE
      - name: android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS
      # "Install on Android" for apps on the desktop; Android asks the user about each one
      - name: android.permission.REQUEST_INSTALL_PACKAGES
      - name: android.permission.WAKE_LOCK
      - name: android.permission.MANAGE_EXTERNAL_STORAGE
      - name: android.permission.READ_EXTERNAL_STORAGE
      - name: android.permission.WRITE_EXTERNAL_STORAGE
        max_sdk_version: 28
      # The OpenXR loader (assets/libs) asks the headset's runtime broker for its runtime.
      - name: org.khronos.openxr.permission.OPENXR
      - name: org.khronos.openxr.permission.OPENXR_SYSTEM
      # Hands as well as controllers: without it, Horizon OS asks for controllers before opening
      # the app ("Switch to Controllers"), even as a panel.
      - name: com.oculus.permission.HAND_TRACKING
    uses_feature:
      - name: android.hardware.type.pc
        required: false
      - name: android.hardware.vr.headtracking
        required: false
        version: 1
      - name: oculus.software.handtracking
        required: false
      # The surroundings behind Linux apps' frames, where they ask for them.
      - name: com.oculus.feature.PASSTHROUGH
        required: false
    # What the OpenXR loader talks to: the runtime brokers, and the runtime's and API layers' services.
    queries:
      providers:
        - authorities: "org.khronos.openxr.runtime_broker;org.khronos.openxr.system_runtime_broker"
      intents:
        - actions:
            - org.khronos.openxr.OpenXRRuntimeService
        - actions:
            - org.khronos.openxr.OpenXRApiLayerService
