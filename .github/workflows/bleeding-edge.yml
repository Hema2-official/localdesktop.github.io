# Builds the "Local Desktop (bleeding edge)" APK from the bleeding-edge branch of this fork: the
# work here that hasn't reached the official app yet. It installs next to the official app as its
# own package (app.polarbear.edge) with its own Linux system, and next to the dev build.
#
# Every push to the branch builds an APK you can download from the run. A tag named
# bleeding-edge-<anything> also publishes it as a GitHub release, with the VR support bundle for
# headsets (scripts/build-xr-bundle.sh) that the APK names: headsets download it instead of
# building it themselves.
#
# The APK is signed with the fork's own key, so that updates install over each other. The key
# comes from the repository secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD (the same names the official build uses).
name: Bleeding edge APK

on:
  workflow_dispatch:
  push:
    branches:
      - bleeding-edge
    tags:
      - "bleeding-edge-*"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

env:
  CARGO_TERM_COLOR: always
  ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
  ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
  ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
  # Its own package next to the official app; build.rs derives the rootfs path from it.
  LOCALDESKTOP_PACKAGE: app.polarbear.edge
  LOCALDESKTOP_LABEL: Local Desktop (bleeding edge)

jobs:
  # Built natively on an arm64 runner, in the Arch Linux the app installs.
  xr-bundle:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04-arm
    outputs:
      file: ${{ steps.bundle.outputs.file }}
      sha256: ${{ steps.bundle.outputs.sha256 }}

    steps:
      - uses: actions/checkout@v4

      - name: Build the VR support bundle
        id: bundle
        run: |
          file="localdesktop-xr-${GITHUB_REF_NAME}.tar.xz"
          sudo env XR_BUNDLE_WORK="$RUNNER_TEMP/xr-bundle" scripts/build-xr-bundle.sh "out/$file"
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "out/$file" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload the bundle
        uses: actions/upload-artifact@v4
        with:
          name: xr-bundle
          path: out/${{ steps.bundle.outputs.file }}
          if-no-files-found: error

  build:
    # Without a bundle too (not a release, or its build failed): headsets then build it.
    needs: xr-bundle
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Name the build
        id: version
        run: |
          base=$(cargo metadata --format-version=1 --no-deps | jq -r '.packages[0].version')
          stamp=$(date -u +%Y%m%d)
          run=$(printf '%02d' $((GITHUB_RUN_NUMBER % 100)))
          echo "name=${base}-bleeding-edge.${stamp}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          # Grows with every build, so that a newer APK installs over an older one.
          echo "code=$(date -u +%y%m%d)${run}" >> "$GITHUB_OUTPUT"
          echo "file=localdesktop-bleeding-edge-${stamp}-${GITHUB_SHA::7}.apk" >> "$GITHUB_OUTPUT"

      - name: Setup signing keystore
        run: |
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "::error::The repository secret ANDROID_KEYSTORE_BASE64 is missing (with ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD). See docs/bleeding-edge.md."
            exit 1
          fi
          mkdir -p target/x/release/android/gradle/app
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > target/x/release/android/gradle/app/release-key.jks
          keytool -list -keystore target/x/release/android/gradle/app/release-key.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" > /dev/null

      # The service type by name: AAPT refuses the hex value the in-repo packager needs, whose
      # android.jar (API 33) predates specialUse.
      - name: Set the package, label and version
        run: |
          sed -i \
            -e "s/^\(    package:\) app\.polarbear\$/\1 $LOCALDESKTOP_PACKAGE\n    version_code: ${{ steps.version.outputs.code }}\n    version_name: \"${{ steps.version.outputs.name }}\"/" \
            -e "s/^\(      label:\) \"Local Desktop\"\$/\1 \"$LOCALDESKTOP_LABEL\"/" \
            -e 's/target_sdk_version: 33/target_sdk_version: 35/' \
            -e 's/foreground_service_type: "0x40000000"/foreground_service_type: specialUse/' \
            manifest.yaml
          grep -q "^    package: $LOCALDESKTOP_PACKAGE\$" manifest.yaml
          grep -q "^    version_code: " manifest.yaml
          grep -q "^      label: \"$LOCALDESKTOP_LABEL\"\$" manifest.yaml
          sed -n '/^  manifest:/,/^    sdk:/p' manifest.yaml

      - name: Install LLVM
        run: sudo apt-get update && sudo apt-get install -y llvm

      - name: Download Android NDK r28
        run: |
          curl -o android-ndk-r28-linux.zip https://dl.google.com/android/repository/android-ndk-r28-linux.zip
          unzip -q android-ndk-r28-linux.zip
          rm android-ndk-r28-linux.zip

      - name: Prepare Android.ndk
        run: |
          TOOLCHAIN=android-ndk-r28/toolchains/llvm/prebuilt/linux-x86_64
          CLANG_VERSION=$(ls $TOOLCHAIN/lib/clang | head -n 1)
          CLANG=$TOOLCHAIN/lib/clang/$CLANG_VERSION

          mkdir Android.ndk
          cp -r $TOOLCHAIN/sysroot/usr Android.ndk/
          cp -r $CLANG/lib/linux/aarch64/* Android.ndk/usr/lib/aarch64-linux-android/
          cp -r $CLANG/lib/linux/arm/* Android.ndk/usr/lib/arm-linux-androideabi/
          cp -r $CLANG/lib/linux/x86_64/* Android.ndk/usr/lib/x86_64-linux-android/
          cp -r $CLANG/lib/linux/i386/* Android.ndk/usr/lib/i686-linux-android/

          echo "INPUT(-lunwind)" > Android.ndk/usr/lib/aarch64-linux-android/libgcc.a
          echo "INPUT(-lunwind)" > Android.ndk/usr/lib/arm-linux-androideabi/libgcc.a
          echo "INPUT(-lunwind)" > Android.ndk/usr/lib/x86_64-linux-android/libgcc.a
          echo "INPUT(-lunwind)" > Android.ndk/usr/lib/i686-linux-android/libgcc.a

          mkdir -p ~/.cache/x/
          mv Android.ndk ~/.cache/x/

      - name: Build xbuild
        working-directory: patches/xbuild
        run: cargo install --path xbuild

      - name: Get the VR support bundle
        if: needs.xr-bundle.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: xr-bundle
          path: out

      # Where the release will have it, and its checksum, for the APK.
      - name: Name the bundle in the APK
        if: needs.xr-bundle.result == 'success'
        run: |
          echo "LOCALDESKTOP_XR_BUNDLE_URL=https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${{ needs.xr-bundle.outputs.file }}" >> "$GITHUB_ENV"
          echo "LOCALDESKTOP_XR_BUNDLE_SHA256=${{ needs.xr-bundle.outputs.sha256 }}" >> "$GITHUB_ENV"

      - name: Build APK
        run: x build --release --platform=android --arch=arm64 --format=apk

      - name: Collect the APK
        run: |
          mkdir -p out
          mv target/x/release/android/gradle/app/build/outputs/apk/release/app-release.apk "out/${{ steps.version.outputs.file }}"
          ls -l out

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.file }}
          path: out/${{ steps.version.outputs.file }}
          if-no-files-found: error

      - name: Release notes
        if: github.ref_type == 'tag'
        run: |
          # The checkout made the tag a lightweight one on the commit, whose contents are the
          # commit's message: fetch the tag itself for its message, the notes.
          git fetch --force --no-tags --depth=1 origin "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          {
            echo "**Local Desktop (bleeding edge)**, version ${{ steps.version.outputs.name }}, built from ${GITHUB_SHA::7}."
            echo
            echo "How to install it, what it is and what to expect: [docs/bleeding-edge.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/docs/bleeding-edge.md)."
            echo
            git tag -l --format='%(contents)' "$GITHUB_REF_NAME"
          } > notes.md

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: Local Desktop (bleeding edge) ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: notes.md
          prerelease: true
          # The APK, and the bundle when there is one.
          files: out/*
